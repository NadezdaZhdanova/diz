<div class="gallery">
<figure>
<img src="1.jpg" width="300" height="210" alt="Хризантема белая">
<figcaption><strong>Хризантема белая.</strong> Сорт этой белой хризантемы очень редкий для нашей страны. Обычно ее привозят из Западной Европы, поэтому ее стоимость с каждым годом повышается </figcaption>
</figure>
<figure>
<img src="2.jpg" width="300" height="210" alt="Роза">
<figcaption><strong>Красная роза.</strong> Собирательное название видов и сортов представителей рода Шипо́вник (лат. Rósa), выращиваемых человеком и растущих в дикой природе.</figcaption>
</figure>
<figure>
<img src="3.jpg" width="300" height="210" alt="Ромашка">
<figcaption><strong>Ромашка.</strong> Род однолетних цветковых растений семейства астровые, или сложноцветные, по современной классификации объединяет около 70 видов невысоких пахучих трав, цветущих с первого года жизни. </figcaption>
</figure>
<figure>
<img src="4.jpg" width="300" height="210" alt="Пионы">
<figcaption><strong>Пионы.</strong> Род травянистых многолетников и листопадных кустарников. Единственный род семейства Пионовые, ранее род относили к семейству Лютиковых.</figcaption>
</figure>
<figure>
<img src="5.jpg" width="300" height="210" alt="Орхидея">
<figcaption><strong>Орхидея.</strong> Это тропическое растение, крупнейшее семейство цветковых растений подкласса лилейных. </figcaption>
</figure>
<figure>
<img src="6.jpg" width="300" height="210" alt="Эустома">
<figcaption><strong>Эустома.</strong>  Род растений семейства Горечавковых. Название происходит от греческих корней эу (хороший) и стома (рот).</figcaption>
</figure>
<figure>
<img src="7.jpg" width="300" height="210" alt="Тюльпан">
<figcaption><strong>Тюльпан.</strong> Тюльпаны относятся семейству лилейные и насчитывают более 3 тысяч сортов. Они имеют цветки с шестью лепестками, цвет и форма которых отличается от вида и сорта.</figcaption>
</figure>
<figure>
<img src="8.jpg" width="300" height="210" alt="Лилии">
<figcaption><strong>Лилии.</strong> Род многолетних луковичных растений семейства Лилейные.Отличительная характеристика соцветий — приятный, уникальный, прекрасный и слегка сладковатый аромат. </figcaption>
</figure>
<figure>
<img src="9.jpg" width="300" height="210" alt="Фиалки">
<figcaption><strong>Фиалки.</strong> Это миниатюрное, популярное и долгоцветущее растение. Её часто используют для украшения интерьера, а многие собирают целые коллекции фиалок.</figcaption>
</figure>
